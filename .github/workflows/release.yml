name: Release

# A pushed tag v* builds the Linux packages and attaches them to a DRAFT release.
# A manual run (workflow_dispatch) builds and uploads the packages as workflow
# artifacts only; the release step runs only when the selected ref is a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tauri.conf.json=$conf package.json=$pkg src-tauri/Cargo.toml=$crate"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Versions differ: tauri.conf.json=$conf, package.json=$pkg, src-tauri/Cargo.toml=$crate. Keep them equal."
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$conf" ]; then
              echo "::error::Tag $REF_NAME does not match version $conf in src-tauri/tauri.conf.json (expected tag v$conf)."
              exit 1
            fi
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            libfuse2t64 openssh-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bun run typecheck
      - run: bun run test

      - name: SSH integration tests (Docker)
        run: cargo test -p linascp-core --test ssh_integration -- --ignored --test-threads=1

      - name: Build packages
        run: bun run tauri build

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          cd dist
          sha256sum *.deb *.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: linascp-linux
          path: dist/*
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
