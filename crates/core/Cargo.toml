[package]
name = "linascp-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "linascp_core"
path = "src/lib.rs"

[dependencies]
# age 0.12 does not compile together with russh 0.64 (ml-kem 0.2 vs 0.3 share one `kem` 0.3.0) -> stay on 0.11.
age = { version = "0.11", features = ["armor"] }
async-trait = "0.1"
base64 = "0.22"
# keyring v4 = keyring-core + backend store crates; the `keyring` crate itself is only a v1-compat/CLI wrapper.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
getrandom = "0.4"
hmac = "0.13"
keyring-core = "1"
md-5 = "0.11"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
russh = "0.64"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
ssh2-config = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"
